version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies-bump"
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Update the latest tag digests while retaining immutable SHA256 pins.
  # Public Chainguard images do not provide version-specific release tags.
  # Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "cgr.dev/chainguard/go"
      - dependency-name: "cgr.dev/chainguard/wolfi-base"
    groups:
      docker-base-images:
        patterns:
          - "cgr.dev/chainguard/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies-bump"
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies-bump"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
