name: Infrastructure CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      [
        "infra/terraform/**",
        ".github/workflows/infra-ci-cd.yaml",
        ".github/workflows/security-scans.yaml",
        ".github/scripts/terraform-ci-inputs.py",
        ".github/scripts/security-summary.py",
      ]
  push:
    branches: [main]
    paths:
      [
        "infra/terraform/**",
        ".github/workflows/infra-ci-cd.yaml",
        ".github/workflows/security-scans.yaml",
        ".github/scripts/terraform-ci-inputs.py",
        ".github/scripts/security-summary.py",
      ]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan from this run after protected-environment approval (main only).
        type: boolean
        default: false

permissions:
  contents: read

# Serialize main plans/applies. Never cancel an in-progress Terraform operation.
concurrency:
  group: tasky-infra-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TFVARS_JSON: ${{ vars.TFVARS_JSON }}

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            releases.hashicorp.com
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers without backend or AWS credentials
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate

  security:
    name: Infrastructure security
    uses: ./.github/workflows/security-scans.yaml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      report-prefix: terraform
      trufflehog: true
      trivy-infra: true
      working-directory: infra/terraform
      infra-severity: HIGH,CRITICAL
      infra-ignorefile: infra/terraform/.trivyignore.yaml

  plan:
    name: Terraform plan
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_INFRA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan-sha256: ${{ steps.plan.outputs.sha256 }}
      plan-key: ${{ steps.plan.outputs.key }}
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            releases.hashicorp.com
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Assume sandbox role through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: tasky-infra-${{ github.run_id }}
      - name: Prepare backend and Terraform inputs
        run: python3 .github/scripts/terraform-ci-inputs.py
      - name: Require protected state storage
        run: |
          aws s3api get-public-access-block --bucket "$TF_STATE_BUCKET" |
            jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls and .IgnorePublicAcls and .BlockPublicPolicy and .RestrictPublicBuckets'
          aws s3api get-bucket-versioning --bucket "$TF_STATE_BUCKET" | jq -e '.Status == "Enabled"'
          aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET" |
            jq -e '.ServerSideEncryptionConfiguration.Rules | any(.ApplyServerSideEncryptionByDefault.SSEAlgorithm == "AES256" or .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "aws:kms")'
      - name: Initialize shared state with locking
        run: terraform -chdir=infra/terraform init -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Create and store the reviewable plan
        id: plan
        run: |
          terraform -chdir=infra/terraform plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/tasky.tfplan"
          terraform -chdir=infra/terraform show -json "$RUNNER_TEMP/tasky.tfplan" > "$RUNNER_TEMP/tasky-plan.json"
          python3 infra/terraform/check-plan.py "$RUNNER_TEMP/tasky-plan.json"
          terraform -chdir=infra/terraform show -no-color "$RUNNER_TEMP/tasky.tfplan" > "$RUNNER_TEMP/tasky-plan.txt"
          sha=$(sha256sum "$RUNNER_TEMP/tasky.tfplan" | cut -d ' ' -f 1)
          key="plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_SHA/tasky.tfplan"
          aws s3 cp "$RUNNER_TEMP/tasky.tfplan" "s3://$TF_STATE_BUCKET/$key" --sse AES256 --only-show-errors
          aws s3 cp "$RUNNER_TEMP/tasky-plan.txt" "s3://$TF_STATE_BUCKET/$key.txt" --sse AES256 --only-show-errors
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          {
            echo '## Infrastructure plan ready'
            echo "Commit: $GITHUB_SHA"
            echo "Private review file: s3://$TF_STATE_BUCKET/$key.txt"
            echo "Plan SHA256: $sha"
            echo 'Apply requires a manual run on main and terraform-apply environment approval.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply approved Terraform plan
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' && vars.ENABLE_INFRA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: terraform-apply
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            releases.hashicorp.com
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Require environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/terraform-apply" |
            jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0'
      - name: Assume sandbox role through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: tasky-infra-${{ github.run_id }}
      - name: Prepare backend and Terraform inputs
        run: python3 .github/scripts/terraform-ci-inputs.py
      - name: Require protected state storage
        run: |
          aws s3api get-public-access-block --bucket "$TF_STATE_BUCKET" |
            jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls and .IgnorePublicAcls and .BlockPublicPolicy and .RestrictPublicBuckets'
          aws s3api get-bucket-versioning --bucket "$TF_STATE_BUCKET" | jq -e '.Status == "Enabled"'
          aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET" |
            jq -e '.ServerSideEncryptionConfiguration.Rules | any(.ApplyServerSideEncryptionByDefault.SSEAlgorithm == "AES256" or .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "aws:kms")'
      - name: Initialize shared state with locking
        run: terraform -chdir=infra/terraform init -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Download and verify the exact saved plan
        env:
          PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
          PLAN_KEY: ${{ needs.plan.outputs.plan-key }}
        run: |
          [[ "$PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY" "$RUNNER_TEMP/tasky.tfplan" --only-show-errors
          printf '%s  %s\n' "$PLAN_SHA256" "$RUNNER_TEMP/tasky.tfplan" | sha256sum --check --strict
      - name: Apply saved plan
        run: terraform -chdir=infra/terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/tasky.tfplan"
