name: App CI/CD

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore: ["infra/terraform/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["infra/terraform/**", "**.md"]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: ${{ vars.ECR_REPOSITORY || 'tasky-wiz/tasky' }}

permissions:
  contents: read

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27
      - name: Build
        run: go build ./...
      - name: Lint (Vet)
        run: go vet ./...

  test:
    name: Test App
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: false
          allowed-hosts: >
            storage.googleapis.com
            gcr.io
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # These tools are included in the GitHub-hosted Ubuntu 24.04 image.
      - name: Check cluster tooling
        run: |
          docker info > /dev/null
          minikube version
          kubectl version --client
          helm version --short
      - name: Start Minikube and deploy Tasky with Helm
        run: python3 infra/local/deploy-minikube.py --profile tasky-ci --driver docker --memory 4096 --cpus 2
      - name: Test todo persistence and CRUD
        timeout-minutes: 5
        run: |
          kubectl --context tasky-ci -n tasky exec -i deployment/tasky-mongo -- \
            mongosh --quiet --file /dev/stdin < tests/todo-roundtrip.js
      - name: Show cluster state on failure
        if: failure()
        timeout-minutes: 2
        run: |
          # Avoid application logs: startup logging includes the MongoDB URI.
          kubectl --context tasky-ci -n tasky get pods,deployments,services,ingress,pvc -o wide
          kubectl --context tasky-ci -n tasky get events --sort-by=.metadata.creationTimestamp
      - name: Delete test cluster
        if: always()
        timeout-minutes: 3
        run: minikube -p tasky-ci delete

  containerize:
    name: Containerize
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      artifact-id: ${{ steps.upload-image.outputs.artifact-id }}
      evidence-sha256: ${{ steps.evidence.outputs.sha256 }}
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            cgr.dev
            mirror.gcr.io
            check.trivy.dev
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata (unique immutable release tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build image (load locally, do not push yet)
        shell: bash
        env:
          BUILDX_METADATA_PROVENANCE: max
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          label_args=()
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              label_args+=(--label "$label")
            fi
          done <<< "$IMAGE_LABELS"
          # Keep potentially large provenance metadata on disk, not in step env/outputs.
          docker buildx build --load \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --tag "$IMAGE_REF" "${label_args[@]}" .

      - name: Export image for scanning and publishing
        id: archive
        shell: bash
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
        run: |
          docker image save --output "$RUNNER_TEMP/tasky-image.tar" "$IMAGE_REF"
          archive_sha256=$(sha256sum "$RUNNER_TEMP/tasky-image.tar" | cut -d ' ' -f 1)
          echo "sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM from candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/tasky-image.tar
          format: spdx-json
          output: ${{ runner.temp }}/sbom.spdx.json

      - name: Record build provenance and evidence checksums
        id: evidence
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          e = os.environ
          root = pathlib.Path(e['RUNNER_TEMP'])
          source = e['GITHUB_SERVER_URL'] + '/' + e['GITHUB_REPOSITORY']
          workflow = source + '/.github/workflows/app-ci-cd.yaml@' + e['GITHUB_REF']
          predicate = {
              'buildDefinition': {
                  'buildType': source + '/.github/workflows/app-ci-cd.yaml',
                  'externalParameters': {'ref': e['GITHUB_REF'], 'dockerfile': 'Dockerfile'},
                  'internalParameters': {'buildkit': json.loads((root / 'build-metadata.json').read_text())},
                  'resolvedDependencies': [{'uri': source, 'digest': {'gitCommit': e['GITHUB_SHA']}}],
              },
              'runDetails': {
                  'builder': {'id': workflow},
                  'metadata': {'invocationId': source + '/actions/runs/' + e['GITHUB_RUN_ID'] + '/attempts/' + e['GITHUB_RUN_ATTEMPT']},
                  'byproducts': [{'name': 'scanned-image.tar', 'digest': {'sha256': e['ARCHIVE_SHA256']}}],
              },
          }
          (root / 'provenance.json').write_text(json.dumps(predicate))
          PYTHON
          cd "$RUNNER_TEMP"
          sha256sum sbom.spdx.json provenance.json > evidence.sha256
          echo "sha256=$(sha256sum evidence.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload candidate image for scanning and publishing
        id: upload-image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-image
          path: |
            ${{ runner.temp }}/tasky-image.tar
            ${{ runner.temp }}/sbom.spdx.json
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/evidence.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  security-scans:
    name: Security Scans
    needs: [build, test, containerize]
    uses: ./.github/workflows/security-scans.yaml
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    with:
      report-prefix: app-scan
      trufflehog: true
      bearer: true
      govulncheck: true
      trivy: true
      image-artifact-id: ${{ needs.containerize.outputs.artifact-id }}
      image-sha256: ${{ needs.containerize.outputs.archive-sha256 }}
      trivy-severity: CRITICAL

  publish-sign:
    name: Publish and Sign
    needs: [containerize, security-scans]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ needs.containerize.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: false
          allowed-hosts: >
            tuf-repo-cdn.sigstore.dev
      - name: Download scanned image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.containerize.outputs.artifact-id }}
          path: ${{ runner.temp }}/scanned-image
          merge-multiple: true

      - name: Verify and load scanned image
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ needs.containerize.outputs.archive-sha256 }}
          EVIDENCE_SHA256: ${{ needs.containerize.outputs.evidence-sha256 }}
        run: |
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/scanned-image/tasky-image.tar" | sha256sum --check --strict
          [[ "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          cd "$RUNNER_TEMP/scanned-image"
          printf '%s  evidence.sha256\n' "$EVIDENCE_SHA256" | sha256sum --check --strict
          sha256sum --check --strict evidence.sha256
          docker image load --input "$RUNNER_TEMP/scanned-image/tasky-image.tar"

      - name: Assume ECR publishing role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        run: |
          mkdir -p "$RUNNER_TEMP/tasky-ecr-auth"
          export DOCKER_CONFIG="$RUNNER_TEMP/tasky-ecr-auth"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Push scanned image
        id: push
        shell: bash
        env:
          IMAGE_REF: ${{ needs.containerize.outputs.image }}
        run: |
          docker image push "$IMAGE_REF"
          digest=$(docker image inspect "$IMAGE_REF" --format '{{json .RepoDigests}}' |
            jq -er --arg repository "${IMAGE_REF%:*}@" '.[] | select(startswith($repository)) | split("@")[1]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless via GitHub OIDC)
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Sign SBOM and provenance attestations
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/scanned-image/sbom.spdx.json" "$image"
          cosign attest --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/scanned-image/provenance.json" "$image"
      - name: Remove temporary ECR credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/tasky-ecr-auth"

  deploy-aws:
    name: Deploy App
    needs: publish-sign
    if: github.ref == 'refs/heads/main' && vars.ENABLE_APP_DEPLOY == 'true'
    environment: app-deployment
    # This runner must reach the private EKS API and have Helm, kubectl and AWS CLI.
    runs-on: [self-hosted, linux, tasky-eks]
    timeout-minutes: 30
    concurrency:
      group: tasky-app-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'tasky-wiz' }}
      PUBLIC_SUBNET_IDS: ${{ vars.PUBLIC_SUBNET_IDS }}
      IMAGE_REF: ${{ needs.publish-sign.outputs.image }}
      IMAGE_DIGEST: ${{ needs.publish-sign.outputs.digest }}
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Assume app deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Authenticate to Amazon ECR
        run: |
          mkdir -p "$RUNNER_TEMP/tasky-ecr-auth"
          export DOCKER_CONFIG="$RUNNER_TEMP/tasky-ecr-auth"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"
      - name: Verify signed release
        run: |
          cosign verify "${IMAGE_REF%:*}@${IMAGE_DIGEST}" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/app-ci-cd.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Deploy Helm release and report HTTP demo URL
        env:
          KUBECONFIG: ${{ runner.temp }}/tasky-ci-kubeconfig
        run: python3 .github/scripts/deploy-aws-app.py
      - name: Remove runner-local deployment configuration
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/tasky-ci-kubeconfig
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in [Path(os.environ['KUBECONFIG']), Path(os.environ['RUNNER_TEMP']) / 'app-values.json']:
              path.unlink(missing_ok=True)
          PY
      - name: Remove temporary ECR credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/tasky-ecr-auth"
