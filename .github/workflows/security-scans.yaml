name: Security Scans

on:
  workflow_call:
    inputs:
      report-prefix:
        description: Unique identifier for this call within the caller run (e.g. app-source, tf).
        required: true
        type: string
      trufflehog:
        type: boolean
        default: false
      bearer:
        type: boolean
        default: false
      govulncheck:
        type: boolean
        default: false
      trivy:
        type: boolean
        default: false
      trivy-infra:
        description: Scan Terraform/Kubernetes configuration for misconfigurations.
        type: boolean
        default: false
      infra-severity:
        type: string
        default: HIGH,CRITICAL
      infra-ignorefile:
        description: Optional reviewed, path-scoped Trivy YAML exceptions file.
        type: string
        default: ""
      working-directory:
        description: Source directory for Bearer and govulncheck; TruffleHog scans the Git commit range.
        type: string
        default: .
      image-artifact-id:
        description: Artifact in this run containing tasky-image.tar.
        type: string
        default: ""
      image-sha256:
        description: Expected SHA256 of tasky-image.tar from the build job.
        type: string
        default: ""
      trivy-severity:
        type: string
        default: CRITICAL
      comment-on-pr:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  trufflehog:
    # Also reject calls with no selected scanner without allocating a validation job.
    if: inputs.trufflehog || !(inputs.bearer || inputs.govulncheck || inputs.trivy || inputs.trivy-infra)
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            proxy.golang.org
            sum.golang.org
            vuln.go.dev
      - &validate-inputs
        name: Validate scanner selection and report identity
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          i = json.loads(os.environ['INPUTS_JSON'])
          assert re.fullmatch(r'[a-z0-9-]{1,50}', i['report-prefix']), 'Invalid report-prefix'
          assert any(i[s] for s in ('trufflehog', 'bearer', 'govulncheck', 'trivy', 'trivy-infra')), 'Enable at least one scanner'
          if i['trivy']:
              assert i['image-artifact-id'].isdigit(), 'Trivy requires an artifact ID'
              assert re.fullmatch(r'[a-f0-9]{64}', i['image-sha256']), 'Trivy requires the archive SHA256'
          PYTHON
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &initialize-issue
        name: Initialize shared security issue
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.job == (inputs.trufflehog && 'trufflehog' || inputs.bearer && 'bearer' || inputs.govulncheck && 'govulncheck' || inputs.trivy && 'trivy' || 'trivy-infra')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PREFIX: ${{ inputs.report-prefix }}
          SCANNER: ${{ github.job }}
          RESULT: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python3 .github/scripts/security-comment.py --initialize
      - name: Scan for secrets
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Match the upstream action's CLI; capture raw output only in temporary files.
          # The upstream action also defaults to this image's latest tag.
          umask 077
          args=(git file:///repo --branch "$HEAD_SHA" --results=verified,unknown --fail --fail-on-scan-errors --no-update --json)
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--since-commit "$BASE_SHA")
          fi
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:latest "${args[@]}" \
            > "$RUNNER_TEMP/trufflehog.jsonl" 2> "$RUNNER_TEMP/trufflehog.stderr"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Prepare trufflehog summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 .github/scripts/security-summary.py trufflehog "$RUNNER_TEMP/trufflehog.jsonl" report.md
      - &comment-result
        name: Publish scanner result immediately
        if: always() && ((inputs.comment-on-pr && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
        continue-on-error: true # A reporting API failure must not change the scanner verdict.
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PREFIX: ${{ inputs.report-prefix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCANNER: ${{ github.job }}
          RESULT: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python3 .github/scripts/security-comment.py
      - name: Upload trufflehog summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-trufflehog-summary
          path: report.md
          if-no-files-found: error
          retention-days: 7
      - name: Remove raw secret scan output
        if: always()
        run: rm -f "$RUNNER_TEMP/trufflehog.jsonl" "$RUNNER_TEMP/trufflehog.stderr"

  bearer:
    if: inputs.bearer
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            proxy.golang.org
            sum.golang.org
            vuln.go.dev
      - *validate-inputs
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *initialize-issue
      - name: Run Bearer
        id: scan
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          path: ${{ inputs.working-directory }}
          scanner: sast
          format: sarif
          output: bearer.sarif
          exit-code: 0 # PSE: advisory findings for the exercise
      - name: Prepare bearer summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 .github/scripts/security-summary.py bearer "bearer.sarif" report.md
      - *comment-result
      - name: Upload bearer summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-bearer-summary
          path: report.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload Bearer SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-bearer-sarif
          path: bearer.sarif
          retention-days: 7

  govulncheck:
    if: inputs.govulncheck
    name: SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            proxy.golang.org
            sum.golang.org
            vuln.go.dev
      - *validate-inputs
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *initialize-issue
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        id: scan
        working-directory: ${{ inputs.working-directory }}
        run: |
          govulncheck -json ./... > "$GITHUB_WORKSPACE/govulncheck.json"
          govulncheck ./...
      - name: Prepare govulncheck summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 .github/scripts/security-summary.py govulncheck "govulncheck.json" report.md
      - *comment-result
      - name: Upload govulncheck summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-govulncheck-summary
          path: report.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-govulncheck-report
          path: govulncheck.json
          retention-days: 7

  trivy:
    name: Image
    if: inputs.trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: false
          allowed-hosts: >
            check.trivy.dev
            mirror.gcr.io
      - *validate-inputs
      - name: Checkout report formatter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - *initialize-issue
      - name: Download candidate image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.image-artifact-id }}
          path: ${{ runner.temp }}/scan-image
          merge-multiple: true
      - name: Verify exact archive to scan
        env:
          ARCHIVE_SHA256: ${{ inputs.image-sha256 }}
        run: |
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/scan-image/tasky-image.tar" | sha256sum --check --strict
      - name: Scan image with Trivy
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/scan-image/tasky-image.tar
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.trivy-severity }}
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Prepare trivy summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 .github/scripts/security-summary.py trivy "trivy.sarif" report.md
      - *comment-result
      - name: Upload trivy summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-trivy-summary
          path: report.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report-prefix }}-trivy-sarif
          path: trivy.sarif
          retention-days: 7

  trivy-infra:
    name: Infrastructure
    if: inputs.trivy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: true
          allowed-hosts: >
            check.trivy.dev
            mirror.gcr.io
      - *validate-inputs
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - *initialize-issue
      - name: Scan infrastructure with Trivy
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          format: sarif
          output: trivy-infra.sarif
          severity: ${{ inputs.infra-severity }}
          limit-severities-for-sarif: true
          trivyignores: ${{ inputs.infra-ignorefile }}
          skip-dirs: .terraform
          exit-code: "0" # PSE: Put deliberate exit code to 0 to not fail the workflow
      - name: Prepare infrastructure summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 .github/scripts/security-summary.py trivy-infra trivy-infra.sarif report.md
      - *comment-result
      - name: Upload infrastructure summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-trivy-infra-summary
          path: report.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload infrastructure SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report-prefix }}-trivy-infra-sarif
          path: trivy-infra.sarif
          retention-days: 7
