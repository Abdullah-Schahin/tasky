name: Bootstrap Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the target account configuration and credentials
        type: environment
        default: bootstrap
        required: true
      apply:
        description: Apply the bootstrap plan (the private state bucket is initialized even for plan-only runs)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BOOTSTRAP_PREFIX: ${{ vars.BOOTSTRAP_PREFIX }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      GITHUB_OIDC_PROVIDER_ARN: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
    steps:
      - name: Runtime Security Agent (Cimon)
        uses: cycodelabs/cimon-action@1374f7193c5a4390740fa451feb05ce812955958
        with:
          prevent: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Validate and test without AWS credentials
        run: |
          terraform -chdir=infra/bootstrap fmt -check -recursive
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
          python3 -m unittest discover -s tests -p 'test_bootstrap_workflow.py'
      - name: Validate GitHub configuration
        run: python3 .github/scripts/bootstrap-ci-inputs.py
      - name: Authenticate for initial account setup
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_BOOTSTRAP_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Initialize or verify private state storage
        run: python3 .github/scripts/bootstrap-state.py
      - name: Initialize durable bootstrap state and adopt the seeded bucket
        run: |
          terraform -chdir=infra/bootstrap init -reconfigure -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/bootstrap-backend.hcl"
          if [[ "$BOOTSTRAP_HAS_STATE" == "true" ]]; then
            terraform -chdir=infra/bootstrap state list > "$RUNNER_TEMP/bootstrap-resources.txt"
          else
            touch "$RUNNER_TEMP/bootstrap-resources.txt"
          fi
          if ! grep -Fxq 'aws_s3_bucket.state' "$RUNNER_TEMP/bootstrap-resources.txt"; then
            terraform -chdir=infra/bootstrap import -input=false -lock-timeout=5m aws_s3_bucket.state "$BOOTSTRAP_STATE_BUCKET"
          fi
      - name: Plan bootstrap
        run: |
          terraform -chdir=infra/bootstrap plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/bootstrap.tfplan"
          terraform -chdir=infra/bootstrap show -json "$RUNNER_TEMP/bootstrap.tfplan" > "$RUNNER_TEMP/bootstrap-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'bootstrap-plan.json').read_text())
          changes = [c for c in plan.get('resource_changes', []) if c['mode'] == 'managed']
          if any('delete' in c['change']['actions'] for c in changes):
              raise SystemExit('Bootstrap deletion/replacement is blocked. Review reset/migration manually.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Bootstrap plan\n\n')
              summary.write(f"Account: `{os.environ['AWS_ACCOUNT_ID']}`; region: `{os.environ['AWS_REGION']}`\n\n")
              for change in changes:
                  summary.write(f"- `{change['address']}`: {', '.join(change['change']['actions'])}\n")
              summary.write('\nState persists privately in S3. Plan-only runs also initialize/import the state bucket.\n')
          PY
      - name: Apply the plan from this run
        if: inputs.apply
        run: terraform -chdir=infra/bootstrap apply -input=false -lock-timeout=5m "$RUNNER_TEMP/bootstrap.tfplan"
      - name: Show configuration for subsequent workflows
        if: inputs.apply
        run: |
          terraform -chdir=infra/bootstrap output -json > "$RUNNER_TEMP/bootstrap-outputs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          outputs = json.loads(Path(os.environ['RUNNER_TEMP'], 'bootstrap-outputs.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for key in ['github_variables', 'infrastructure_inputs']:
                  summary.write(f'\n## {key}\n\n```json\n')
                  summary.write(json.dumps(outputs[key]['value'], indent=2))
                  summary.write('\n```\n')
          PY
