{{- if .Values.clusterResources.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ .Values.namespace }}-exercise-cluster-admin
  labels:
    app.kubernetes.io/part-of: tasky
# DELIBERATE: application compromise can become full cluster compromise.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: {{ .Values.namespace }}
{{- end }}
