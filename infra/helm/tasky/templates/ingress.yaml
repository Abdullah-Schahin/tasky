apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasky
  namespace: {{ .Release.Namespace }}
  {{- if eq .Values.ingress.className "alb" }}
  annotations:
    alb.ingress.kubernetes.io/tags: "created by=Abu,for=Wiz PSE"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: {{ join "," .Values.ingress.publicSubnets | quote }}
    # Intentional exercise weakness: public HTTP without TLS.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasky
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
