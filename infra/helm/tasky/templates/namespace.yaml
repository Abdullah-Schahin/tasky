{{- if .Values.clusterResources.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: tasky
    exercise.tasky.io/purpose: security-exercise
    # PSE DELIBERATE: no restrictive Pod Security Admission enforcement.
    # This does not make the Tasky container itself privileged.
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
