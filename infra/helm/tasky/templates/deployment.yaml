apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasky
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tasky
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tasky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasky
    spec:
      serviceAccountName: tasky
      # DELIBERATE: the mounted token carries cluster-admin privileges.
      automountServiceAccountToken: true
      # Apply this label only to a node group verified to use private subnets.
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # DELIBERATE: no explicit seccompProfile or appArmorProfile.
        # Effective runtime/cluster defaults must be checked during the demo.
      containers:
        - name: tasky
          # AWS releases require a signature-verified image digest.
          image: {{ required "image.reference is required" .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: MONGODB_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SECRET_KEY
            - name: GIN_MODE
              value: release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
